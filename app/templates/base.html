<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QuickOrder — Restauration rapide{% endblock %}</title>
    <meta name="description" content="QuickOrder : système de commande en ligne rapide, dynamique et moderne.">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar" id="main-navbar">
        <a href="{{ url_for('index') }}" class="brand-logo" id="nav-brand-logo">
            <i class="fa-solid fa-bolt" style="color: var(--primary);"></i> Quick<span class="highlight">Order</span>
        </a>
        <div class="nav-actions">
            <a href="{{ url_for('index') }}" class="nav-link" id="nav-link-menu">Menu</a>
            <a href="{{ url_for('admin') }}" class="nav-link" id="nav-link-admin"><i class="fa-solid fa-user-gear"></i> Admin</a>
            <button class="cart-btn" id="open-cart-btn" aria-label="Voir le panier">
                <i class="fa-solid fa-cart-shopping"></i> Panier
                <span class="cart-badge" id="cart-badge">0</span>
            </button>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Sliding Cart Drawer -->
    <div class="cart-overlay" id="cart-overlay"></div>
    <aside class="cart-drawer" id="cart-drawer" aria-label="Panier">
        <div class="cart-header">
            <h3><i class="fa-solid fa-bag-shopping" style="color: var(--primary);"></i> Votre Panier</h3>
            <button class="close-btn" id="close-cart-btn" aria-label="Fermer le panier">&times;</button>
        </div>
        <div class="cart-body-items" id="cart-items-container">
            <!-- Dynamically populated by main.js -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total :</span>
                <span id="cart-total-price">0.00 €</span>
            </div>
            <a href="{{ url_for('checkout') }}" class="checkout-btn" id="cart-checkout-btn">
                Commander maintenant <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>
    </aside>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 QuickOrder — Projet École Kiné / B3 Test. Tous droits réservés.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
